# Rebuilds the app data from the workbook in source/ and publishes the site
# to GitHub Pages every time something is committed to the main branch.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Convert the workbook into app data
        run: python tools/build_data.py

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest icons data _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
